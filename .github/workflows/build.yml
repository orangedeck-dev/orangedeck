# Bauen fuer Linux, Windows und macOS.
#
# **Warum ueberhaupt:** entwickelt wird auf einem Arch-Rechner mit Qt 6.11.
# Was auf den beiden anderen Systemen passiert, hat bis zum 04.09.2026
# niemand gesehen -- und der Tag hat gezeigt, wie viel man **nicht** sieht,
# solange nur eine Umgebung die Software anfasst: dem Android-APK fehlte
# monatelang TLS, ohne dass es auffallen konnte.
#
# Gebaut wird ohne Signatur. Nutzerentscheidung vom 02.09.2026: das Projekt
# darf nichts kosten, und ein Windows-Zertifikat liegt bei 200-400 EUR im
# Jahr, das Apple-Programm bei 99. Die Artefakte tragen deshalb eine Warnung
# im Namen -- SmartScreen und Gatekeeper werden meckern, und das soll niemand
# ueberraschen.
name: Bauen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Einmal die Woche, damit macOS nicht unbemerkt bricht (siehe Job macOS).
  schedule:
    - cron: "17 4 * * 1"

# Ein neuer Push macht den vorigen Lauf ueberfluessig.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 6.9 ist das Mindeste (siehe CMakeLists.txt: `SafeArea` gibt es erst ab
  # da, und ohne die zeichnet Android unter die Statusleiste).
  #
  # **Nicht 6.8**: die Reihe verlinkt auf macOS noch das Framework AGL, und
  # das SDK von macOS 15 hat es nicht mehr -- der erste Lauf brach mit
  # "ld: framework 'AGL' not found" ab.
  QT_VERSION: 6.9.*

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Qt holen
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          # QtWebSockets traegt den Direktbezug. **Ohne das Modul faellt er
          # weg** -- und ausserhalb von Linux gibt es keinen Dienst, der
          # einspringen koennte.
          modules: qtwebsockets
          cache: true

      - name: Bauwerkzeug
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Bauen
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Nachsehen, was hineingebaut wurde
        run: |
          # Der Bau meldet selbst, ob Direktbezug und Layer-Shell drin sind.
          # Faellt QtWebSockets weg, ist die Anwendung ausserhalb von Linux
          # unbrauchbar -- das darf nicht stillschweigend durchgehen.
          cmake -S . -B build 2>&1 | tee cmake.log
          grep -q "QtWebSockets vorhanden" cmake.log || {
            echo "::error::QtWebSockets fehlt -- ohne Direktbezug"; exit 1; }

      - name: Terminal-Werkzeug und geteilte Konstanten
        run: |
          # Dienst und Terminal-Werkzeug muessen sich uebersetzen lassen, und
          # die Gebuehrenklassen muessen an allen drei Stellen gleich sein --
          # sonst hat dieselbe Gebuehr im Terminal eine andere Farbe als in
          # der App.
          python3 -m py_compile daemon/orangedeck cli/orangedeck-cli
          python3 cli/orangedeck-cli --help > /dev/null
          d=$(grep -h '^FEE_BUCKETS' daemon/orangedeck | sed 's/.*= *//')
          c=$(grep -h '^FEE_BUCKETS' cli/orangedeck-cli | sed 's/.*= *//')
          q=$(grep -h '^var FEE_EDGES' ui/qml/colors.js | sed 's/.*= *//; s/;$//')
          echo "Dienst:   $d"; echo "Terminal: $c"; echo "App:      $q"
          [ "$d" = "$c" ] && [ "$d" = "$q" ] || { echo "::error::FEE_BUCKETS weichen voneinander ab"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: orangedeck-linux-x86_64
          path: build/orangedeck-app

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Qt holen
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtwebsockets
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Bauen
        shell: cmd
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Zusammenpacken
        shell: cmd
        run: |
          mkdir dist
          copy build\orangedeck-app.exe dist\
          rem `--qmldir` zeigt auf die Quellen: die QML-Dateien stecken zwar
          rem als Ressource im Programm, windeployqt liest die Importe aber
          rem aus dem Quelltext, um die noetigen Qt-Module zu finden.
          rem
          rem **Die C++-Laufzeit gehoert neben die EXE, nicht als Installer
          rem daneben.** Ohne `--no-compiler-runtime` legt windeployqt nur
          rem vc_redist.x64.exe ins Paket (18 MB) und installiert nichts. Am
          rem 12.09.2026 auf einem frischen Windows 11 25H2 gestartet: "Die
          rem Ausfuehrung des Codes kann nicht fortgesetzt werden, da
          rem MSVCP140.dll nicht gefunden wurde". Im System lagen nur die
          rem .NET-Varianten (vcruntime140_clr0400.dll). Microsoft erlaubt
          rem die Laufzeit-DLLs ausdruecklich app-lokal; dann laeuft das ZIP
          rem ohne jede Installation.
          rem
          rem **Beide QML-Verzeichnisse, nicht nur ui\qml.** Main.qml liegt
          rem unter app\qml und importiert QtCore (fuer Settings). Mit nur
          rem `--qmldir ui\qml` sah windeployqt diesen Import nie, QtCore fehlte
          rem im Paket, und die EXE startete ohne ein einziges Fenster --
          rem lautlos, denn eine GUI-EXE hat keine Konsole. Am 12.09.2026 erst
          rem mit QT_FORCE_STDERR_LOGGING sichtbar geworden:
          rem   Main.qml:12:1: module "QtCore" is not installed
          windeployqt --qmldir ui\qml --qmldir app\qml --release --no-translations --no-compiler-runtime dist\orangedeck-app.exe
          if not exist dist\qml\QtCore (echo ::error::QML-Modul QtCore fehlt im Paket & exit /b 1)
          for /d %%D in ("%VCToolsRedistDir%x64\Microsoft.VC*.CRT") do copy /y "%%D\*.dll" dist\
          rem Lieber ein lauter Abbruch als ein Paket, das bei niemandem startet.
          for %%F in (msvcp140.dll vcruntime140.dll vcruntime140_1.dll) do if not exist dist\%%F (echo ::error::%%F fehlt im Paket & exit /b 1)

      - uses: actions/upload-artifact@v4
        with:
          name: orangedeck-windows-x86_64-UNSIGNIERT
          path: dist

  # **Nicht bei jedem Push.** macOS wird nicht ausgeliefert, nur probehalber
  # gebaut. Am 01. und 02.10.2026 lief der Job zweimal 15 Minuten ins Leere
  # ("The job was not acquired by Runner", GitHub meldet knappe
  # macOS-arm64-Runner) und faerbte damit den ganzen Lauf rot, obwohl Linux,
  # Flatpak und Windows gruen waren. Jetzt: woechentlich und von Hand
  # (gh workflow run build.yml).
  macos:
    name: macOS
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Qt holen
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtwebsockets
          cache: true

      - name: Bauwerkzeug
        run: brew install ninja

      - name: Bauen
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Zusammenpacken
        run: |
          # Qt legt unter macOS ein .app an, wenn MACOSX_BUNDLE gesetzt ist.
          # Ist es das nicht, liegt eine nackte ausfuehrbare Datei da -- dann
          # wird die eingepackt, damit der Lauf nicht ohne Ergebnis endet.
          mkdir -p dist
          if [ -d build/orangedeck-app.app ]; then
            # Beide QML-Verzeichnisse: Main.qml (app/qml) importiert QtCore,
            # das mit nur ui/qml fehlte -- unter Windows am 12.09.2026 gesehen,
            # hier dieselbe Zeile. Geprueft wird nur mit Warnung, weil der
            # Pfad im Buendel nicht auf einem Mac nachgesehen ist.
            macdeployqt build/orangedeck-app.app -qmldir=ui/qml -qmldir=app/qml
            find build/orangedeck-app.app -type d -name QtCore -path "*qml*" | grep -q . \
              || echo "::warning::QML-Modul QtCore nicht im .app gefunden"
            cp -R build/orangedeck-app.app dist/
          else
            echo "::warning::kein .app-Buendel -- MACOSX_BUNDLE ist nicht gesetzt"
            cp build/orangedeck-app dist/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: orangedeck-macos-UNSIGNIERT
          path: dist

  flatpak:
    name: Flatpak aus dem Repo
    runs-on: ubuntu-latest
    steps:
      # **Ganze Historie, nicht nur die Spitze.** Die Pruefung unten sieht im
      # gepinnten Stand nach, ob die Dateien dort wirklich liegen -- mit dem
      # voreingestellten `fetch-depth: 1` waere dieser Commit gar nicht da,
      # und die Pruefung meldete Unsinn statt eines Befundes.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # **Der `commit:` im Bauplan ist die einzige Stelle, die der Lauf
      # darunter nicht prueft** -- er setzt sie vorher auf den eigenen Stand.
      # Am 05.09.2026 ist sie deshalb dreimal hinterhergehinkt, einmal auf
      # einen Stand, an dem es die zu installierenden Dateien gar nicht gab.
      # Diese Pruefung sieht dort nach, bevor irgendetwas ueberschrieben wird.
      #
      # **Hier nur als Warnung.** Ob Nummer, Metainfo und Pin zusammenpassen,
      # ist eine Frage des Veroeffentlichens: zwischen dem Hochsetzen der
      # Nummer und dem Pin ist die Pruefung zwangslaeufig rot, und dann lief der
      # Bau darunter gar nicht erst. Seit dem 20.09.2026 brachen so neun von
      # zehn Flatpak-Laeufen ab, ohne dass am Stand etwas falsch war. Zum
      # Veroeffentlichen laeuft die Pruefung lokal und muss dort sauber sein
      # (docs/STAND.md, "Release, in dieser Reihenfolge").
      - name: Bauplan pruefen
        run: |
          if ! python3 tools/bauplan-pruefen.py > bauplan.txt 2>&1; then
            cat bauplan.txt
            grep -E '^\s+\*' bauplan.txt | sed 's/^\s*\* *//' | while read -r zeile; do
              echo "::warning title=Bauplan, vor dem Veroeffentlichen beheben::$zeile"
            done
          else
            cat bauplan.txt
          fi

      # **Kein fertiges Abbild.** Der erste Anlauf nahm
      # `bilelmoussaoui/flatpak-github-actions:kde-6.9` -- das Abbild gibt es
      # nicht ("manifest unknown"), und welche Marken existieren, muesste man
      # raten. Selbst einrichten ist ein paar Zeilen mehr und haengt an
      # nichts, was sich unter uns aendern kann.
      - name: Flatpak einrichten
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --if-not-exists --user \
            flathub https://flathub.org/repo/flathub.flatpakrepo
          # Flathub antwortet nicht immer beim ersten Mal; dreimal versuchen.
          for versuch in 1 2 3; do
            flatpak install --user -y --noninteractive \
              flathub org.kde.Platform//6.9 org.kde.Sdk//6.9 && break
            [ "$versuch" = 3 ] && exit 1
            sleep 30
          done

      # **Heruntergeladene Quellen zwischen den Laeufen behalten.** layer-shell-qt
      # kam bei jedem Lauf neu von download.kde.org, und die Fassung liegt seit
      # Anfang Oktober 2026 nur noch im Archiv dort und auf wenigen Spiegeln;
      # zweimal ging ein Lauf nur im zweiten Versuch durch, am 03.10.2026 gar
      # nicht. Der Schluessel haengt am Bauplan: aendert sich eine Quelle,
      # wird neu geladen.
      - name: Quellen aus dem Speicher
        uses: actions/cache@v4
        with:
          path: .flatpak-builder/downloads
          key: flatpak-quellen-${{ hashFiles('packaging/flatpak/dev.orangedeck.OrangeDeck.yml') }}
          restore-keys: flatpak-quellen-

      # **Der Bauplan zum Ausliefern, nicht der zum Arbeiten.** Der andere
      # baut aus dem Arbeitsverzeichnis (`type: dir`) -- hier gibt es keines,
      # der Laeufer klont nur das Repo. Dieser Lauf prueft also zugleich, ob
      # der Auslieferungs-Bauplan noch stimmt; er ist auf einen Commit
      # festgenagelt und veraltet sonst unbemerkt.
      # **Auf den Stand dieses Laufs setzen.** Der Bauplan ist auf einen
      # Commit festgenagelt -- das ist zum Ausliefern richtig, hier aber
      # falsch: der Lauf soll pruefen, ob **dieser** Stand durchbaut, nicht
      # ein alter. Die Datei im Repo bleibt unangetastet; geaendert wird nur
      # die Kopie im Laeufer.
      - name: Bauplan auf diesen Commit stellen
        run: |
          sed -i "s|^        commit: .*|        commit: ${{ github.sha }}|" \
            packaging/flatpak/dev.orangedeck.OrangeDeck.yml
          grep -A2 "type: git" packaging/flatpak/dev.orangedeck.OrangeDeck.yml

      - name: Bauen und buendeln
        run: |
          # Erst nur laden, bei einem Netzfehler bis zu dreimal; der Bau danach
          # nimmt, was schon da ist.
          for versuch in 1 2 3; do
            flatpak-builder --user --download-only --force-clean \
              build-fp packaging/flatpak/dev.orangedeck.OrangeDeck.yml && break
            [ "$versuch" = 3 ] && exit 1
            sleep 30
          done
          flatpak-builder --user --repo=repo --force-clean \
            build-fp packaging/flatpak/dev.orangedeck.OrangeDeck.yml
          flatpak build-bundle repo orangedeck.flatpak \
            dev.orangedeck.OrangeDeck \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo

      - uses: actions/upload-artifact@v4
        with:
          name: orangedeck-flatpak
          path: orangedeck.flatpak
